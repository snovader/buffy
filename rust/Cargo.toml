[workspace]
members = ["benchmarks", "core", "gen"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/snovader/buffy"

[profile.release]
codegen-units = 1
lto = true

# The generator's WebAssembly module, which hosts download and load, so it's
# built for size, and it aborts on a panic rather than unwinding
[profile.wasm]
inherits = "release"
opt-level = "s"
panic = "abort"
strip = true
