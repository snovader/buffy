[package]
name = "tafla-benchmarks"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# Criterion parses the arguments of `cargo bench`, which libtest's harness of
# the library and binaries would reject, so only the benchmark is benched
[lib]
bench = false

[[bin]]
name = "report"
bench = false

[[bin]]
name = "encoding"
bench = false

[[bench]]
name = "comparison"
harness = false

[dependencies]
tafla = { path = "../core" }
flatbuffers = "25.12.19"
prost = "0.14.4"
rkyv = "0.8.18"
rmp-serde = "1.3.1"
serde = { version = "1.0.229", features = ["derive"] }
# Reads Criterion's samples in the report
serde_json = "1.0.154"

[dev-dependencies]
# Without plots, which the report replaces, and without rayon, so that the
# analysis between benchmarks runs on the benchmarks' thread
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }

[lints.clippy]
all = "warn"
pedantic = "warn"
nursery = "warn"
must_use_candidate = { level = "allow", priority = 1 }
suboptimal_flops = { level = "allow", priority = 1 }
