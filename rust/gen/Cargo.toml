[package]
name = "tafla-gen"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "tafla_gen"
# cdylib for the WebAssembly module, see README.md
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "tafla-gen"
path = "src/main.rs"

[features]
default = ["typescript", "python", "java", "rust"]
# Each target language's generator, so that a crate that generates one
# language from its build script doesn't compile the others. `typescript`
# generates JavaScript too.
typescript = []
python = []
java = []
rust = []

[dev-dependencies]
# Runs the Rust generated from the example schemas in tests/generated_*.rs
tafla = { path = "../core" }
proptest = "1"
# Parses the cases of conformance/generated in tests/shapes_cases.rs, with
# floats exactly rather than to within an ulp
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
tempfile = "3"

[lints.clippy]
all = "warn"
pedantic = "warn"
must_use_candidate = { level = "allow", priority = 1 }
