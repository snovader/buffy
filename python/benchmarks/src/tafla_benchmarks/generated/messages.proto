// The workloads' messages, the same as the TypeScript comparison's. proto3 packs
// repeated scalars by default. See the README for the command that generates
// messages_pb2.py and messages_pb2.pyi from this file.
syntax = "proto3";

package tafla.benchmarks;

message Record { double x = 1; double y = 2; int64 id = 3; string name = 4; }

message Columns {
    int64 base = 1;
    repeated uint32 keys = 2;
    repeated float a = 3;
    repeated float b = 4;
}

message Document {
    double x = 1;
    double y = 2;
    string name = 3;
    Columns columns = 4;
}

message Pair { float first = 1; float second = 2; }
message Item { float value = 1; Pair pair = 2; }
message List { repeated Item items = 1; }

message Sample { uint32 key = 1; float a = 2; float b = 3; }
