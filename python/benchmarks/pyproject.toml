[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"

[project]
name = "buffy-benchmarks"
version = "0.0.0"
description = "Benchmarks of buffy-core, compared with other Python libraries"
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
classifiers = ["Private :: Do Not Upload"]
dependencies = [
  "buffy-core",
  "flatbuffers>=25.12.19",
  "msgpack>=1.2.4",
  "numpy>=2.5.4",
  "protobuf>=7.36.2",
  "pyperf>=2.10.0",
]

[tool.uv.sources]
buffy-core = { workspace = true }

[dependency-groups]
# protoc, which generates the protobuf messages; see README.md
protoc = ["grpcio-tools>=1.85.1"]
