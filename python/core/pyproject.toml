[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[project]
name = "tafla"
version = "0.0.0"
description = "Binary tables of scalars, strings and typed arrays"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "snovader" }]
keywords = ["binary", "buffer", "serialization", "table", "typed array", "zero-copy"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
requires-python = ">=3.14"
dependencies = []

[project.urls]
Homepage = "https://github.com/snovader/tafla/tree/main/python/core#readme"
Source = "https://github.com/snovader/tafla"
Issues = "https://github.com/snovader/tafla/issues"
Specification = "https://github.com/snovader/tafla/blob/main/SPEC.md"
