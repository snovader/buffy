version: 2
updates:
  # Each language adds its own ecosystem when its code moves here
  - package-ecosystem: "github-actions"
    directories:
      - "/.github/actions/*"
      - "/.github/workflows"
    schedule:
      interval: "daily"

  - package-ecosystem: "npm"
    directory: "/typescript"
    schedule:
      interval: "daily"
    groups:
      "vitest":
        patterns:
          - "vite"
          - "vitest"
          - "@vitest/*"

  - package-ecosystem: "uv"
    directory: "/python"
    schedule:
      interval: "daily"
