name: Rust

on:
  push:
    branches:
      - main
    paths:
      - ".github/actions/prepare-node-environment/action.yml"
      - ".github/workflows/rust.yml"
      - "conformance/**"
      - "rust/**"
      - "schemas/**"
      # The generator's golden files of the other targets, in their languages'
      # test trees, and not the tests beside them
      - "java/core/src/test/java/io/github/snovader/buffy/test/generated/*/**"
      - "python/core/tests/generated/*/**"
      - "typescript/core/test/generated/*/**"

  pull_request:
    branches:
      - main
    paths:
      - ".github/actions/prepare-node-environment/action.yml"
      - ".github/workflows/rust.yml"
      - "conformance/**"
      - "rust/**"
      - "schemas/**"
      # The generator's golden files of the other targets, in their languages'
      # test trees, and not the tests beside them
      - "java/core/src/test/java/io/github/snovader/buffy/test/generated/*/**"
      - "python/core/tests/generated/*/**"
      - "typescript/core/test/generated/*/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  formatting:
    name: Formatting
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: rust
    steps:
      - name: Checkout GitHub repo
        uses: actions/checkout@v7

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          components: rustfmt
          cache: false

      - name: Run formatting check
        run: cargo fmt --all -- --check

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: rust
    steps:
      - name: Checkout GitHub repo
        uses: actions/checkout@v7

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          components: clippy
          cache-workspaces: rust -> target

      - name: Run lint check
        run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: Test (${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: rust
    strategy:
      fail-fast: false
      matrix:
        # stable, and the workspace's rust-version
        toolchain: ["stable", "1.88"]
    steps:
      - name: Checkout GitHub repo
        uses: actions/checkout@v7

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: ${{ matrix.toolchain }}
          cache-workspaces: rust -> target
          cache-key: ${{ matrix.toolchain }}

      - name: Run tests
        run: cargo +${{ matrix.toolchain }} test

  big-endian:
    name: Test (big-endian, Miri)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: rust
    steps:
      - name: Checkout GitHub repo
        uses: actions/checkout@v7

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: nightly
          components: miri, rust-src
          cache-workspaces: rust -> target
          cache-key: miri

      # The runtime only: the generator reads and writes no bytes in either
      # order, and would take long under Miri
      - name: Run tests on a big-endian target
        run: cargo +nightly miri test -p buffy-core --target powerpc-unknown-linux-gnu

      # Miri isolates the tests from the file system, so the conformance suite
      # is ignored above
      - name: Run the conformance suite on a big-endian target
        env:
          MIRIFLAGS: -Zmiri-disable-isolation
        run: cargo +nightly miri test -p buffy-core --target powerpc-unknown-linux-gnu --test conformance -- --include-ignored

  benchmark:
    name: Benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: rust
    steps:
      - name: Checkout GitHub repo
        uses: actions/checkout@v7

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          cache-workspaces: rust -> target
          cache-key: benchmark

      # Shared runners are too noisy for the numbers to mean much; these runs
      # check that every codec in the comparison reads back what it wrote, and
      # that the benchmarks work
      - name: Run round-trip test
        run: cargo test -p buffy-benchmarks --test round_trip

      - name: Run benchmarks briefly
        run: cargo bench -p buffy-benchmarks -- --warm-up-time 0.05 --measurement-time 0.05 --sample-size 10 --nresamples 1000

      - name: Print the fastest samples
        run: cargo run -p buffy-benchmarks --bin report

      - name: Print encoded sizes
        run: cargo run -p buffy-benchmarks --bin encoding

  wasm:
    name: WebAssembly
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: rust
    steps:
      - name: Checkout GitHub repo
        uses: actions/checkout@v7

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          target: wasm32-unknown-unknown
          components: clippy
          cache-workspaces: rust -> target
          cache-key: wasm

      - name: Setup Node
        uses: ./.github/actions/prepare-node-environment

      # The lint job doesn't compile the module's exports, which only
      # WebAssembly builds have
      - name: Run lint check
        run: cargo clippy -p buffy-gen --lib --target wasm32-unknown-unknown -- -D warnings

      - name: Build the generator's module
        run: cargo build -p buffy-gen --lib --target wasm32-unknown-unknown --profile wasm

      - name: Check that the module has no imports and generates the golden files
        run: node gen/tests/wasm/check.mjs target/wasm32-unknown-unknown/wasm/buffy_gen.wasm

  dependabot:
    needs: [formatting, lint, test, big-endian, benchmark, wasm]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
      contents: write
    if: ${{ github.actor == 'dependabot[bot]' && github.event_name == 'pull_request'}}
    steps:
      - id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"
      - run: |
          gh pr review --approve "$PR_URL"
          gh pr merge --squash --match-head-commit "$PR_HEAD_SHA" "$PR_URL"
        env:
          PR_URL: ${{github.event.pull_request.html_url}}
          PR_HEAD_SHA: ${{github.event.pull_request.head.sha}}
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
