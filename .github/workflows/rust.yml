name: Rust

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

# Read-only, unless a job asks for more
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # Every push and pull request runs this workflow, so that its required check
  # always reports, and the jobs below run only when the change touches these
  # paths
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      # A pull request lists its files through the API, and a push compares
      # its commits, which needs the repository
      - name: Checkout GitHub repo
        if: github.event_name == 'push'
        uses: actions/checkout@v7

      - name: Filter the changed paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            rust:
              - ".github/actions/prepare-node-environment/action.yml"
              - ".github/workflows/rust.yml"
              - "conformance/**"
              - "rust/**"
              - "schemas/**"
              # The generator's golden files of the other targets, in their
              # languages' test trees, and not the tests beside them
              - "java/core/src/test/java/io/github/snovader/buffy/test/generated/*/**"
              - "python/core/tests/generated/*/**"
              - "typescript/core/test/generated/*/**"

  formatting:
    name: Formatting
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: rust
    steps:
      - name: Checkout GitHub repo
        uses: actions/checkout@v7

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          components: rustfmt
          cache: false

      - name: Run formatting check
        run: cargo fmt --all -- --check

  lint:
    name: Lint
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: rust
    steps:
      - name: Checkout GitHub repo
        uses: actions/checkout@v7

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          components: clippy
          cache-workspaces: rust -> target

      - name: Run lint check
        run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: Test (${{ matrix.toolchain }})
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: rust
    strategy:
      fail-fast: false
      matrix:
        # stable, and the workspace's rust-version
        toolchain: ["stable", "1.88"]
    steps:
      - name: Checkout GitHub repo
        uses: actions/checkout@v7

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: ${{ matrix.toolchain }}
          cache-workspaces: rust -> target
          cache-key: ${{ matrix.toolchain }}

      - name: Run tests
        run: cargo +${{ matrix.toolchain }} test

  big-endian:
    name: Test (big-endian, Miri)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: rust
    steps:
      - name: Checkout GitHub repo
        uses: actions/checkout@v7

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: nightly
          components: miri, rust-src
          cache-workspaces: rust -> target
          cache-key: miri

      # The runtime only: the generator reads and writes no bytes in either
      # order, and would take long under Miri
      - name: Run tests on a big-endian target
        run: cargo +nightly miri test -p buffy-core --target powerpc-unknown-linux-gnu

      # Miri isolates the tests from the file system, so the conformance suite
      # is ignored above
      - name: Run the conformance suite on a big-endian target
        env:
          MIRIFLAGS: -Zmiri-disable-isolation
        run: cargo +nightly miri test -p buffy-core --target powerpc-unknown-linux-gnu --test conformance -- --include-ignored

  benchmark:
    name: Benchmark
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: rust
    steps:
      - name: Checkout GitHub repo
        uses: actions/checkout@v7

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          cache-workspaces: rust -> target
          cache-key: benchmark

      # Shared runners are too noisy for the numbers to mean much; these runs
      # check that every codec in the comparison reads back what it wrote, and
      # that the benchmarks work
      - name: Run round-trip test
        run: cargo test -p buffy-benchmarks --test round_trip

      - name: Run benchmarks briefly
        run: cargo bench -p buffy-benchmarks -- --warm-up-time 0.05 --measurement-time 0.05 --sample-size 10 --nresamples 1000

      - name: Print the fastest samples
        run: cargo run -p buffy-benchmarks --bin report

      - name: Print encoded sizes
        run: cargo run -p buffy-benchmarks --bin encoding

  wasm:
    name: WebAssembly
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: rust
    steps:
      - name: Checkout GitHub repo
        uses: actions/checkout@v7

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          target: wasm32-unknown-unknown
          components: clippy
          cache-workspaces: rust -> target
          cache-key: wasm

      - name: Setup Node
        uses: ./.github/actions/prepare-node-environment

      # The lint job doesn't compile the module's exports, which only
      # WebAssembly builds have
      - name: Run lint check
        run: cargo clippy -p buffy-gen --lib --target wasm32-unknown-unknown -- -D warnings

      - name: Build the generator's module
        run: cargo build -p buffy-gen --lib --target wasm32-unknown-unknown --profile wasm

      - name: Check that the module has no imports and generates the golden files
        run: node gen/tests/wasm/check.mjs target/wasm32-unknown-unknown/wasm/buffy_gen.wasm

  # The check that the main branch's ruleset requires. It passes when every job
  # passed, or was skipped because the change doesn't touch Rust.
  checks:
    name: Rust checks
    needs: [changes, formatting, lint, test, big-endian, benchmark, wasm]
    # Runs after a failure too, since GitHub counts a skipped required check as
    # passed
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if a job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
