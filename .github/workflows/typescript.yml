name: TypeScript

on:
  push:
    branches:
      - main
    paths:
      - ".github/actions/prepare-node-dependencies/action.yml"
      - ".github/actions/prepare-node-environment/action.yml"
      - ".github/workflows/typescript.yml"
      - "conformance/**"
      - "typescript/**"

  pull_request:
    branches:
      - main
    paths:
      - ".github/actions/prepare-node-dependencies/action.yml"
      - ".github/actions/prepare-node-environment/action.yml"
      - ".github/workflows/typescript.yml"
      - "conformance/**"
      - "typescript/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: typescript
    steps:
      - name: Checkout GitHub repo
        uses: actions/checkout@v7

      - name: Prepare dependencies
        uses: ./.github/actions/prepare-node-dependencies

      - name: Run format check
        run: yarn format:check

      - name: Run lint check
        run: yarn lint:check

      - name: Run type check
        run: yarn typecheck

      - name: Vulnerability audit
        run: yarn npm audit -RA

  test:
    name: Test (Node ${{ matrix.node_version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: typescript
    strategy:
      fail-fast: false
      matrix:
        node_version: ["24.x", "26.x"]
    steps:
      - name: Checkout GitHub repo
        uses: actions/checkout@v7

      - name: Prepare dependencies
        uses: ./.github/actions/prepare-node-dependencies
        with:
          node-version: ${{ matrix.node_version }}

      - name: Run tests
        run: yarn test

  dependabot:
    needs: [verify, test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
      contents: write
    if: ${{ github.actor == 'dependabot[bot]' && github.event_name == 'pull_request'}}
    steps:
      - id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"
      - run: |
          gh pr review --approve "$PR_URL"
          gh pr merge --squash --match-head-commit "$PR_HEAD_SHA" "$PR_URL"
        env:
          PR_URL: ${{github.event.pull_request.html_url}}
          PR_HEAD_SHA: ${{github.event.pull_request.head.sha}}
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
