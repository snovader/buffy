name: "Prepare Environment"
description: "Set up a Node.js environment"

inputs:
  node-version:
    description: "The Node.js version to use"
    required: false

runs:
  using: "composite"
  steps:
    - name: Use Node.js
      uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version || '26.x' }}
